[tool.uv]
override-dependencies = [
    "transformers>=5",
    "torch==2.11.0"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128"},
]
pyg_lib = [
    { index = "pytorch-geometric-cu128"},
]
torch_scatter = [
    { index = "pytorch-geometric-cu128"},
]
bleurt = { git = "https://github.com/google-research/bleurt.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-geometric-cu128"
url = "https://data.pyg.org/whl/torch-2.11.0+cu128.html"
explicit = true
format = "flat"

[tool.uv.workspace]
members = [
    "code_data_exploration",
    "code_experiments",
]
